<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QashFlow | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0a0b10; --primary: #5a7bfa; --border-color: rgba(255,255,255,0.08); }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .image-side { width: 50%; background-image: url('https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?q=80&w=2071&auto=format&fit=crop'); background-size: cover; background-position: center; position: relative; }
        .image-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to right, rgba(10,11,16,0.6), rgba(10,11,16,0.9)); display: flex; flex-direction: column; justify-content: center; padding: 60px; }
        .image-overlay h1 { font-size: 3.5rem; margin-bottom: 15px; font-weight: 700; line-height: 1.2; }
        .image-overlay p { font-size: 1.2rem; color: #ccc; max-width: 450px; line-height: 1.6; }

        .form-side { width: 50%; background: var(--bg-dark); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 50px; }
        .form-container { width: 100%; max-width: 400px; }
        .brand { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--primary); }
        
        input { width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white; outline: none; font-family: 'Inter'; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        
        .btn-main { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 20px; font-size: 1rem; }
        .btn-main:hover { background: #4a68df; box-shadow: 0 0 20px rgba(90, 123, 250, 0.4); }
        
        .toggle-text { font-size: 0.9rem; color: #8b92a5; cursor: pointer; text-align: center; }
        .toggle-text:hover { color: white; }
        .toggle-text span { color: var(--primary); font-weight: 600; }

        @media (max-width: 900px) { .image-side { display: none; } .form-side { width: 100%; } }
    </style>
</head>
<body>
    <div class="image-side">
        <div class="image-overlay">
            <h1>Master your money.</h1>
            <p>Track expenses, set monthly budgets, and visualize your financial growth with QashFlow.</p>
        </div>
    </div>

    <div class="form-side">
        <div class="form-container">
            <div class="brand"><i class="fa-solid fa-wallet"></i> QashFlow</div>
            
            <div id="loginForm">
                <h2 style="margin-bottom: 30px; font-weight: 500;">Welcome Back</h2>
                <input type="text" id="loginUser" placeholder="Username">
                <input type="password" id="loginPass" placeholder="Password">
                <button class="btn-main" onclick="doLogin()">Login</button>
                <div class="toggle-text" onclick="toggleForm('register')">Don't have an account? <span>Sign Up</span></div>
            </div>

            <div id="registerForm" style="display: none;">
                <h2 style="margin-bottom: 30px; font-weight: 500;">Create Account</h2>
                <input type="text" id="regUser" placeholder="Username">
                <input type="password" id="regPass" placeholder="Password">
                <button class="btn-main" onclick="doRegister()">Sign Up</button>
                <div class="toggle-text" onclick="toggleForm('login')">Already have an account? <span>Login</span></div>
            </div>
        </div>
    </div>

    <script>
        function toggleForm(formType) {
            if (formType === 'register') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            } else {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            }
        }

        function doLogin() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            if(!username || !password) return alert("Please fill all fields");

            fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            }).then(res => res.json().then(data => ({ status: res.status, body: data })))
              .then(res => {
                  if (res.status === 200) window.location.reload();
                  else alert(res.body.error);
              });
        }

        function doRegister() {
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;
            if(!username || !password) return alert("Please fill all fields");

            fetch('/api/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            }).then(res => res.json().then(data => ({ status: res.status, body: data })))
              .then(res => {
                  if (res.status === 201) {
                      alert("Account created! Please login.");
                      toggleForm('login');
                  } else alert(res.body.error);
              });
        }
    </script>
</body>
</html>
